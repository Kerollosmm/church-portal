  <script>
    var appStarted = false;
    // Hide the loading screen once (fade, then remove).
    function splashDone() {
      var s = document.getElementById('splash'); if (!s || s.classList.contains('gone')) return;
      // Fade out over the first content frame (its hero art fades in), then remove.
      s.classList.add('gone');
      setTimeout(function () { s.remove(); }, 600);
    }
    // ADR-038: Flutter's first frame no longer hides the screen by itself —
    // the app says when its first real content is painted. Cap: 9 s after the
    // first frame (the app then shows its fallback / loading states).
    window.addEventListener('app-content-ready', splashDone);
    window.addEventListener('flutter-first-frame', function () {
      appStarted = true;
      if (window.__appContentReady) { splashDone(); return; }
      setTimeout(splashDone, 9000);
    });
    // Failure path: replace the progress indicator with a message + reload link if the
    // bootstrap script fails to load or Flutter never renders a frame.
    function splashFailed() {
      if (appStarted) return;
      var s = document.getElementById('splash'); if (!s) return;
      var prog = s.querySelector('.progress-track, .ring'); if (prog) prog.remove();
      var t = document.getElementById('splash-text');
      if (t) {
        t.className = 'splash-error';
        t.innerHTML = 'تعذّر تحميل الموقع. <a href="" onclick="location.reload();return false;" style="color:#6E1C1C;font-weight:700;text-decoration:underline;">أعد المحاولة</a>' +

      }
    }
    window.addEventListener('error', function (e) {
      if (e && e.target && e.target.tagName === 'SCRIPT') splashFailed();
    }, true);
    setTimeout(splashFailed, 30000);
  </script>
