name: Seed Firestore

# Manual: Actions -> Seed Firestore -> Run workflow
on:
  workflow_dispatch:
    inputs:
      admin:
        description: "Optional first admin as UID:email (creates admins/{uid})"
        required: false
        default: ""
      admin_email:
        description: "Optional admin email: finds/creates the Auth user, makes it owner, and emails a set-password link"
        required: false
        default: ""
      only:
        description: "Optional comma-separated collections (e.g. settings or clinics,meetings). Empty = all"
        required: false
        default: ""
      fill_missing:
        description: "Existing docs: add only the fields they lack (never changes existing values)"
        type: boolean
        default: false
      force:
        description: "Overwrite existing documents (DANGER: replaces edits made in /admin)"
        type: boolean
        default: false

jobs:
  seed:
    runs-on: ubuntu-latest
    # Writes to the production database: gate it behind the `production`
    # environment (add required reviewers in Settings -> Environments).
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: ./.github/actions/firebase-credentials
        with:
          service-account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ASAFRA_CHURCH_PORTAL }}
      - run: npm install
        working-directory: tool
      - name: Seed
        env:
          IN_FORCE: ${{ inputs.force }}
          IN_FILL: ${{ inputs.fill_missing }}
          IN_ONLY: ${{ inputs.only }}
          IN_ADMIN: ${{ inputs.admin }}
          IN_ADMIN_EMAIL: ${{ inputs.admin_email }}
        run: |
          # Inputs are passed via env and quoted (no shell interpolation of user input).
          set -- --project asafra-church-portal
          if [ "$IN_FORCE" = "true" ]; then set -- "$@" --force; fi
          if [ "$IN_FILL" = "true" ]; then set -- "$@" --fill-missing; fi
          if [ -n "$IN_ONLY" ]; then
            case "$IN_ONLY" in *[!a-z_,]*) echo "invalid 'only' value"; exit 1;; esac
            set -- "$@" --only "$IN_ONLY"
          fi
          if [ -n "$IN_ADMIN" ]; then set -- "$@" --admin "$IN_ADMIN"; fi
          if [ -n "$IN_ADMIN_EMAIL" ]; then set -- "$@" --admin-email "$IN_ADMIN_EMAIL"; fi
          node tool/seed_firestore.js "$@"
      - name: Email set-password link to admin
        if: inputs.admin_email != ''
        env:
          ADMIN_EMAIL: ${{ inputs.admin_email }}
        run: |
          # Public web API key (same as in lib/firebase_options.dart); Firebase emails the reset link, nothing secret is logged.
          case "$ADMIN_EMAIL" in *[!A-Za-z0-9@._+-]*) echo "invalid email"; exit 1;; esac
          curl -sf -X POST "https://identitytoolkit.googleapis.com/v1/accounts:sendOobCode?key=AIzaSyBEHiTY84sHSgLeV_cZ8p-kiKX-IWivByU" \
            -H 'Content-Type: application/json' \
            -d "{\"requestType\":\"PASSWORD_RESET\",\"email\":\"$ADMIN_EMAIL\"}" > /dev/null && echo "Set-password email sent"
      - if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
