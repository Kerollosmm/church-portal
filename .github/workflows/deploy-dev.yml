name: Deploy dev (testing channel)

# The `dev` branch is the real-world testing environment (see docs/DEV-ENVIRONMENT.md).
# push to dev -> 1. rules emulator tests, 2. Firestore rules + indexes to the LIVE
#                project asafra-church-portal (rules are project-wide!),
#                3. Hosting channel `dev` of site maximos-domadios-church
#                (stable URL, expires 30 days after the latest deploy: every
#                push / manual run refreshes it).
# main stays production (deploy.yml). This workflow never deploys live Hosting.
on:
  push:
    branches: [dev]
  workflow_dispatch: {}

# Never overlap two dev deploys; a newer push waits for the running one.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  FIREBASE_PROJECT_ID: asafra-church-portal
  # Not named CHANNEL: subosito/flutter-action reads $CHANNEL and would install Flutter's "dev" channel.
  HOSTING_CHANNEL: dev

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Build web (release, Sentry environment "dev")
        env:
          # The reCAPTCHA Enterprise key must list the dev channel domain
          # (maximos-domadios-church--dev-*.web.app) for App Check to work here.
          RECAPTCHA_SITE_KEY: ${{ vars.RECAPTCHA_SITE_KEY || '' }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN || '' }}
          SENTRY_ENVIRONMENT: dev
          GIT_SHA: ${{ github.sha }}
        run: |
          APP_VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | head -1)
          DEFINES=(--source-maps --dart-define=SENTRY_ENVIRONMENT="$SENTRY_ENVIRONMENT" --dart-define=GIT_SHA="$GIT_SHA" --dart-define=APP_VERSION="$APP_VERSION")
          if [ -n "$SENTRY_DSN" ]; then DEFINES+=(--dart-define=SENTRY_DSN="$SENTRY_DSN"); fi
          if [ -n "$RECAPTCHA_SITE_KEY" ]; then DEFINES+=(--dart-define=RECAPTCHA_SITE_KEY="$RECAPTCHA_SITE_KEY"); fi
          echo "::notice::dev build: environment=$SENTRY_ENVIRONMENT release=church-portal@$APP_VERSION+${GIT_SHA:0:7} appCheck=$([ -n "$RECAPTCHA_SITE_KEY" ] && echo on || echo off)"
          flutter build web --release "${DEFINES[@]}"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Firebase credentials (read-only sitemap export)
        continue-on-error: true
        uses: ./.github/actions/firebase-credentials
        with:
          service-account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ASAFRA_CHURCH_PORTAL }}
      - name: Sitemap from Firestore (static fallback)
        run: bash tool/build_sitemap.sh build/web/sitemap.xml
      - name: Day commemoration JSON (Katameros, live copy as fallback)
        continue-on-error: true
        run: |
          mkdir -p build/web/data
          node tool/fetch_synaxarium.js build/web/data/today.json \
            || curl -sf --max-time 20 https://maximos-domadios-church.web.app/data/today.json -o build/web/data/today.json \
            || echo "::warning::no /data/today.json in this build"
      - name: Katameros readings window (PR B; the dev web + test APK read it from this channel)
        continue-on-error: true
        run: |
          mkdir -p build/web/data/readings
          node tool/fetch_readings.js build/web/data/readings --days=9 --previous-url https://maximos-domadios-church.web.app/data/readings/ \
            || echo "::warning::no readings in this build"
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
      - name: Fingerprint icon fonts (cache busting, PR #23)
        run: python3 tool/fingerprint_icon_fonts.py build/web
      - uses: actions/upload-artifact@v5
        with:
          name: web-build-dev
          path: build/web
          retention-days: 3

  # Test APK (debug-signed, never a release) that reads static data from the dev
  # channel. Served at <dev channel>/app/android/church-portal-dev-arm64.apk.
  apk:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - name: Build test APKs (data from the dev channel)
        run: |
          APP_VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | head -1)
          # GitHub release downloads (Gradle, Kotlin) sometimes answer 504: retry.
          for i in 1 2 3; do flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 \
            --dart-define=APP_BUILD=${APP_VERSION#*+} --dart-define=SENTRY_ENVIRONMENT=dev \
            --dart-define=GIT_SHA=$GITHUB_SHA --dart-define=APP_VERSION=$APP_VERSION \
            --dart-define=SITE_ORIGIN=${{ vars.DEV_CHANNEL_ORIGIN || 'https://maximos-domadios-church--dev-7qxh72kj.web.app' }} \
            && break; [ $i = 3 ] && exit 1; echo "::warning::APK build attempt $i failed, retrying"; sleep 90; done
          mkdir -p apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk apk/church-portal-dev-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk apk/church-portal-dev-arm32.apk
          ls -l apk
      - uses: actions/upload-artifact@v5
        with: { name: apk-dev, path: apk/*.apk, retention-days: 7 }

  # Rules deploy to the live project only after the emulator suite passes.
  rules-test:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tool/rules_test/package-lock.json
      - name: Install
        working-directory: tool/rules_test
        run: npm ci --no-audit --no-fund
      - name: Firestore rules tests (emulator)
        working-directory: tool/rules_test
        run: npm test

  deploy-rules:
    # LIVE project: dev rules must stay backward compatible with main's app.
    needs: [build, rules-test]
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    concurrency:
      group: firestore-rules
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: ./.github/actions/firebase-credentials
        with:
          service-account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ASAFRA_CHURCH_PORTAL }}
      - name: Deploy Firestore rules & indexes (from dev, to the live project)
        run: |
          echo "::notice::Deploying firestore.rules from dev@${GITHUB_SHA:0:7} to $FIREBASE_PROJECT_ID (project-wide; a later main deploy replaces them)"
          npx --yes firebase-tools@latest deploy --only firestore:rules,firestore:indexes --project "$FIREBASE_PROJECT_ID" --non-interactive
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"

  deploy-channel:
    needs: [build, deploy-rules, apk]
    # The web build ships even when the test APK failed (the APK is then missing from the channel).
    if: ${{ !cancelled() && github.ref == 'refs/heads/dev' && needs.build.result == 'success' && needs.deploy-rules.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: web-build-dev
          path: build/web
      - uses: actions/download-artifact@v5
        if: needs.apk.result == 'success'
        with:
          name: apk-dev
          path: build/web/app/android
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: ./.github/actions/firebase-credentials
        with:
          service-account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ASAFRA_CHURCH_PORTAL }}
      - name: Deploy Hosting channel `dev` (30 days, refreshed on every deploy)
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest hosting:channel:deploy "$HOSTING_CHANNEL" --only app \
            --expires 30d --project "$FIREBASE_PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/deploy.json" \
            || { cat "$RUNNER_TEMP/deploy.json"; exit 1; }
          python3 - "$RUNNER_TEMP/deploy.json" <<'PY'
          import json, os, sys
          text = open(sys.argv[1], encoding="utf-8").read()
          data = json.JSONDecoder().raw_decode(text[text.index("{"):])[0]
          if data.get("status") != "success":
              sys.exit(f"dev channel deploy failed: {data.get('error') or data}")
          sites = data.get("result") or {}
          for v in sites.values():
              if isinstance(v, dict) and v.get("url"):
                  print(f"::notice::dev channel: {v['url']} (expires {v.get('expireTime', '?')})")
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
                      s.write(f"### dev channel\n\n{v['url']}\n\nExpires: {v.get('expireTime', '?')}\n")
                  break
          else:
              sys.exit("dev channel deploy returned no URL")
          PY
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
