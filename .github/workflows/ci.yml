name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Build web (release)
        # Not deployed: tagged `ci` so a crash while testing this build is
        # never mistaken for production (Sentry, ADR-034).
        env:
          SENTRY_DSN: ${{ vars.SENTRY_DSN || '' }}
        run: |
          APP_VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | head -1)
          DEFINES=(--dart-define=SENTRY_ENVIRONMENT=ci --dart-define=GIT_SHA="$GITHUB_SHA" --dart-define=APP_VERSION="$APP_VERSION")
          if [ -n "$SENTRY_DSN" ]; then DEFINES+=(--dart-define=SENTRY_DSN="$SENTRY_DSN"); fi
          flutter build web --release "${DEFINES[@]}"

      - name: Fingerprint icon fonts (cache busting, PR #23)
        run: python3 tool/fingerprint_icon_fonts.py build/web

      - name: Validate seed JSON
        run: node -e "JSON.parse(require('fs').readFileSync('assets/seed/seed.json','utf8')); console.log('seed.json OK')"

      - name: Seed JSON matches its generator
        run: |
          python3 tool/gen_seed.py
          git diff --exit-code -- assets/seed/seed.json tool/retired_seed_ids.json tool/known_seed_ids.json

  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tool/rules_test/package-lock.json
      - name: Install
        working-directory: tool/rules_test
        run: npm ci --no-audit --no-fund
      - name: Firestore rules tests (emulator)
        working-directory: tool/rules_test
        run: npm test
