name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Build web (release)
        run: flutter build web --release

      - name: Validate seed JSON
        run: node -e "JSON.parse(require('fs').readFileSync('assets/seed/seed.json','utf8')); console.log('seed.json OK')"

      - name: Seed JSON matches its generator
        run: |
          python3 tool/gen_seed.py
          git diff --exit-code -- assets/seed/seed.json tool/retired_seed_ids.json
