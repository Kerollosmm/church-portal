name: Keep-Alive Scheduled Workflows

on:
  schedule:
    # 1st of every month at 04:00 UTC (prevent GitHub 60-day inactivity workflow disabling)
    - cron: '0 4 1 * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5

      - name: Keep-alive synaxarium publisher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow disable synaxarium.yml
          sleep 5
          gh workflow enable synaxarium.yml
          echo "Successfully toggled synaxarium.yml keepalive."
