name: Deploy to Firebase

# push to main -> live Hosting + Firestore rules/indexes. Hosting has two targets (.firebaserc):
#   app             -> site maximos-domadios-church (the Flutter web app, https://maximos-domadios-church.web.app)
#   legacy-redirect -> site asafra-church-portal (old domain: 301 of every path to the new domain)
# pull request -> preview channel pr-<number> of the app target only (URL commented on the PR, expires in 7 days)
on:
  push:
    branches: [main]
  pull_request:

env:
  FIREBASE_PROJECT_ID: asafra-church-portal

jobs:
  build:
    # Skip PRs from forks: they cannot read the deploy secret.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Build web (release)
        env:
          # The reCAPTCHA Enterprise site key (repo variable, public value) is
          # registered for the live domains only, so preview builds are made
          # without it: App Check stays off there and the App Check-enforced
          # assistant is hidden instead of failing (ADR-014 / ADR-029).
          RECAPTCHA_SITE_KEY: ${{ github.event_name == 'push' && vars.RECAPTCHA_SITE_KEY || '' }}
          # Sentry error tracking (ADR-034). The DSN is public: an optional
          # repository variable SENTRY_DSN overrides it, otherwise the release
          # build uses the project DSN in lib/config/app_config.dart.
          SENTRY_DSN: ${{ vars.SENTRY_DSN || '' }}
          SENTRY_ENVIRONMENT: ${{ github.event_name == 'push' && 'production' || 'preview' }}
          GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          APP_VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | head -1)
          DEFINES=(--source-maps --dart-define=SENTRY_ENVIRONMENT="$SENTRY_ENVIRONMENT" --dart-define=GIT_SHA="$GIT_SHA" --dart-define=APP_VERSION="$APP_VERSION")
          if [ -n "$SENTRY_DSN" ]; then DEFINES+=(--dart-define=SENTRY_DSN="$SENTRY_DSN"); fi
          echo "::notice::Sentry: environment=$SENTRY_ENVIRONMENT release=church-portal@$APP_VERSION+${GIT_SHA:0:7}"
          if [ -n "$RECAPTCHA_SITE_KEY" ]; then
            echo "::notice::App Check: building with RECAPTCHA_SITE_KEY (reCAPTCHA Enterprise)"
            flutter build web --release "${DEFINES[@]}" --dart-define=RECAPTCHA_SITE_KEY="$RECAPTCHA_SITE_KEY"
          else
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::warning::RECAPTCHA_SITE_KEY repository variable is empty: App Check is off and the assistant is hidden on the live site"
            fi
            flutter build web --release "${DEFINES[@]}"
          fi
      # sitemap.xml from Firestore (ADR-038): the Spark plan has no Cloud
      # Functions, so the sitemap is built here, READ-ONLY (get() calls only),
      # with the deploy key. Any failure keeps the static web/sitemap.xml.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Firebase credentials (read-only sitemap export)
        continue-on-error: true
        uses: ./.github/actions/firebase-credentials
        with:
          service-account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ASAFRA_CHURCH_PORTAL }}
      - name: Sitemap from Firestore (static fallback)
        run: bash tool/build_sitemap.sh build/web/sitemap.xml
      - name: Day commemoration JSON (ADR-040; Katameros, live copy as fallback)
        # /data/today.json is refreshed twice a day by synaxarium.yml; every
        # deploy also ships a fresh copy so a code deploy never drops it.
        continue-on-error: true
        run: |
          mkdir -p build/web/data
          node tool/fetch_synaxarium.js build/web/data/today.json \
            || curl -sf --max-time 20 https://maximos-domadios-church.web.app/data/today.json -o build/web/data/today.json \
            || echo "::warning::no /data/today.json in this build (the app falls back to its computed feast list)"
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
      - name: Fingerprint icon fonts (cache busting, PR #23)
        # The tree-shaken icon fonts keep one file name per build but Hosting
        # caches fonts for 7 days: a hashed name makes a new subset a new URL.
        run: python3 tool/fingerprint_icon_fonts.py build/web
      - uses: actions/upload-artifact@v5
        with:
          name: web-build
          path: build/web
          retention-days: 3

  deploy-live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # After the rules (PR #24, CodeRabbit): a new app may write a field the
    # old rules reject (e.g. settings/features.errorReporting).
    needs: [build, deploy-rules]
    runs-on: ubuntu-latest
    # Shared with synaxarium.yml (ADR-040): never interleave two releases.
    concurrency:
      group: hosting-live
      cancel-in-progress: false
    environment:
      name: production
      url: https://maximos-domadios-church.web.app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: web-build
          path: build/web
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: ./.github/actions/firebase-credentials
        with:
          service-account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ASAFRA_CHURCH_PORTAL }}
      - name: Deploy Hosting (live app + legacy redirect site)
        run: npx --yes firebase-tools@latest deploy --only hosting:app,hosting:legacy-redirect --project "$FIREBASE_PROJECT_ID" --non-interactive
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"

  # Same Firestore rules emulator tests as ci.yml's firestore-rules job, so a
  # rules change that fails them can never be deployed (CI is a separate workflow).
  rules-test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tool/rules_test/package-lock.json
      - name: Install
        working-directory: tool/rules_test
        run: npm ci --no-audit --no-fund
      - name: Firestore rules tests (emulator)
        working-directory: tool/rules_test
        run: npm test

  deploy-rules:
    # Rules / indexes deploy only after build (test + release build) and the
    # rules emulator tests pass. (flutter analyze runs in ci.yml, not here.)
    needs: [build, rules-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Rules deploys use the `production` environment. Its required reviewers
    # gate them only once they are configured on that environment.
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: ./.github/actions/firebase-credentials
        with:
          service-account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ASAFRA_CHURCH_PORTAL }}
      - name: Deploy Firestore rules & indexes
        run: npx --yes firebase-tools@latest deploy --only firestore:rules,firestore:indexes --project "$FIREBASE_PROJECT_ID" --non-interactive
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"

  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: web-build
          path: build/web
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: ./.github/actions/firebase-credentials
        with:
          service-account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ASAFRA_CHURCH_PORTAL }}
      - name: Deploy preview channel
        id: deploy
        env:
          CHANNEL: pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest hosting:channel:deploy "$CHANNEL" --only app \
            --expires 7d --project "$FIREBASE_PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/deploy.json" \
            || { cat "$RUNNER_TEMP/deploy.json"; exit 1; }
          python3 - "$RUNNER_TEMP/deploy.json" <<'PY'
          import json, os, sys
          text = open(sys.argv[1], encoding="utf-8").read()
          # Keep only the JSON document (skip any non-JSON lines npx may print).
          data = json.JSONDecoder().raw_decode(text[text.index("{"):])[0]
          if data.get("status") != "success":
              sys.exit(f"Preview deploy failed: {data.get('error') or data}")
          sites = data.get("result") or {}
          urls = [v.get("url") for v in sites.values() if isinstance(v, dict) and v.get("url")]
          expires = next((v.get("expireTime") for v in sites.values() if isinstance(v, dict) and v.get("expireTime")), "")
          if not urls:
              sys.exit("Preview deploy returned no URL")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"url={urls[0]}\nexpires={expires}\n")
          print(f"Preview URL: {urls[0]}")
          PY
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
      - name: Comment preview URL on the PR
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          PREVIEW_EXPIRES: ${{ steps.deploy.outputs.expires }}
        with:
          script: |
            const marker = '<!-- firebase-hosting-preview -->';
            const body = [
              marker,
              `**Firebase Hosting preview** for ${context.payload.pull_request.head.sha.slice(0, 7)}`,
              '',
              `🔗 ${process.env.PREVIEW_URL}`,
              '',
              `Expires: ${process.env.PREVIEW_EXPIRES || 'in 7 days'}`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
