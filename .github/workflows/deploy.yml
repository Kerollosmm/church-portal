name: Deploy to Firebase

# push to main -> live Hosting + Firestore rules/indexes
# pull request -> Hosting preview channel (URL commented on the PR, expires in 7 days)
on:
  push:
    branches: [main]
  pull_request:

env:
  FIREBASE_PROJECT_ID: asafra-church-portal

jobs:
  build:
    # Skip PRs from forks: they cannot read the deploy secret.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Build web (release)
        run: flutter build web --release --dart-define=RECAPTCHA_SITE_KEY=${{ vars.RECAPTCHA_SITE_KEY || 'PLACEHOLDER_RECAPTCHA_V3_SITE_KEY' }}
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 3

  deploy-live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://asafra-church-portal.web.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ASAFRA_CHURCH_PORTAL }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          channelId: live

  deploy-rules:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Write service account key
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ASAFRA_CHURCH_PORTAL }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Deploy Firestore rules & indexes
        run: npx --yes firebase-tools@latest deploy --only firestore:rules,firestore:indexes --project "$FIREBASE_PROJECT_ID" --non-interactive
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"

  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ASAFRA_CHURCH_PORTAL }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          expires: 7d
