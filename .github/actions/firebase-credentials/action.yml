name: Firebase service-account credentials
description: >
  Writes the Firebase service-account secret to $RUNNER_TEMP/sa.json (chmod 600)
  and exports GOOGLE_APPLICATION_CREDENTIALS. Tolerates stray characters around
  the JSON (e.g. a trailing newline or text pasted after the closing brace):
  only the first JSON object is kept. The key is never printed.
inputs:
  service-account:
    description: Service-account JSON (pass a secret)
    required: true
  project-id:
    description: Firebase project whose APIs are known to be enabled
    required: false
    default: asafra-church-portal
runs:
  using: composite
  steps:
    - name: Normalise service-account JSON
      shell: bash
      env:
        SA_JSON: ${{ inputs.service-account }}
      run: |
        set -euo pipefail
        umask 077
        raw="$RUNNER_TEMP/sa.raw"
        trap 'rm -f "$raw"' EXIT
        printf '%s' "$SA_JSON" > "$raw"
        python3 - "$raw" "$RUNNER_TEMP/sa.json" <<'PY'
        import json, os, sys
        src, dst = sys.argv[1], sys.argv[2]
        s = open(src, encoding="utf-8-sig").read().strip()
        if not s:
            sys.exit("Service-account secret is empty")
        try:
            obj, end = json.JSONDecoder().raw_decode(s)
        except json.JSONDecodeError as e:
            sys.exit(f"Service-account secret is not valid JSON (line {e.lineno} col {e.colno})")
        if not isinstance(obj, dict) or obj.get("type") != "service_account" \
                or not obj.get("private_key") or not obj.get("client_email"):
            sys.exit("Secret is JSON but not a service-account key")
        extra = len(s) - end
        if extra:
            print(f"::warning::Ignored {extra} extra character(s) after the service-account JSON; consider re-saving the secret.")
        with open(dst, "w", encoding="utf-8") as f:
            json.dump(obj, f)
        os.chmod(dst, 0o600)
        print(f"Service-account key OK (project {obj.get('project_id', '?')})")
        PY
        echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
    - name: Skip firebase-tools API-enablement probe
      # firebase-tools checks every API through serviceusage.services.get,
      # which the deploy service account is not granted (403 "Permission
      # denied to get service [firebasehosting.googleapis.com]"). These APIs
      # are already enabled on the project, so pre-seed firebase-tools' own
      # enablement cache (configstore) instead of widening the key's IAM roles.
      shell: bash
      env:
        PROJECT_ID: ${{ inputs.project-id }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json, os
        base = os.environ.get("XDG_CONFIG_HOME") or os.path.join(os.path.expanduser("~"), ".config")
        path = os.path.join(base, "configstore", "firebase-tools.json")
        os.makedirs(os.path.dirname(path), exist_ok=True)
        try:
            cfg = json.load(open(path))
        except Exception:
            cfg = {}
        cache = cfg.setdefault("apiEnablementCache", {}).setdefault(os.environ["PROJECT_ID"], {})
        for api in ("firebasehosting.googleapis.com", "firestore.googleapis.com",
                    "firebaserules.googleapis.com", "identitytoolkit.googleapis.com"):
            cache[api] = True
        json.dump(cfg, open(path, "w"))
        print("firebase-tools API cache primed:", ", ".join(sorted(cache)))
        PY
