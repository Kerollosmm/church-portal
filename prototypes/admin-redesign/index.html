<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إدارة موقع الكنيسة — نموذج تجريبي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" /></noscript>
  <style>
    :root {
      /* Golden Hour theme tokens from lib/core/theme.dart & lib/domain/occasion_theme.dart */
      --bg: #FBF3E4;
      --surface: #FFF9EE;
      --surface-alt: #F4E6CC;
      --primary: #6E1C1C;
      --primary-deep: #4F1010;
      --primary-light: #8E2A24;
      --on-primary: #FFFFFF;
      --on-primary-accent: #E7C27A;
      --ink: #3A2416;
      --muted: #6A4A2E;
      --gold-ornament: #C9963F;
      --gold-text: #6F4C0E;
      --script: #9A2A1E;
      --hairline: #E2C99A;
      --success: #2E6B45;
      --success-bg: #EAF4EE;
      --success-border: #9CC7AC;
      --alert: #B3261E;
      --alert-bg: #FFF4E0;
      --alert-soft: #FDECEC;
      --notice-bg: #FFF3CD;
      --notice-edge: #E0C36A;
      --shadow-sm: 0 2px 6px rgba(96, 50, 8, 0.08);
      --shadow-panel: 0 10px 28px -12px rgba(96, 50, 8, 0.22), 0 2px 6px rgba(96, 50, 8, 0.08);

      --radius-panel: 20px;
      --radius-card: 16px;
      --radius-input: 12px;
      --radius-pill: 999px;

      --space-xs: 4px;
      --space-s: 8px;
      --space-m: 12px;
      --space-l: 16px;
      --space-xl: 24px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      font-family: 'IBM Plex Sans Arabic', Tahoma, 'Segoe UI', Arial, sans-serif;
      background-color: #EFE2CA;
      color: var(--ink);
      line-height: 1.6;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
    }

    /* Native 360px mobile container — edge-to-edge on 360px devices, centered phone canvas on desktop */
    .phone-shell {
      width: 100%;
      max-width: 360px;
      min-height: 100dvh;
      background-color: var(--bg);
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 0 1px var(--hairline), var(--shadow-panel);
    }

    @media (max-width: 400px) {
      body {
        background-color: var(--bg);
      }
      .phone-shell {
        max-width: 100%;
        box-shadow: none;
      }
    }

    button, input, textarea, select {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible,
    a:focus-visible,
    [tabindex]:focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 2px;
    }

    /* Top App Bar */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(251, 243, 228, 0.96);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--hairline);
      padding: 6px 12px;
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .topbar-start {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }

    .back-btn {
      min-height: 44px;
      min-width: 44px;
      padding: 0 10px;
      border-radius: var(--radius-pill);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--primary);
      font-weight: 700;
      font-size: 14px;
      background: var(--surface);
      border: 1px solid var(--hairline);
      flex-shrink: 0;
    }

    .back-btn:active {
      background: var(--surface-alt);
    }

    .topbar-title-wrap {
      min-width: 0;
      flex: 1;
    }

    .topbar-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    .topbar-sub {
      font-size: 11px;
      color: var(--muted);
      display: block;
      line-height: 1.2;
    }

    .sample-pill {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      background: var(--notice-bg);
      border: 1px solid var(--notice-edge);
      color: var(--ink);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      padding: 12px 14px 88px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .main-content.home-content {
      padding-top: 10px;
      gap: 10px;
    }

    /* Headings */
    .page-heading {
      margin: 0;
      font-size: 21px;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.25;
    }

    .page-lead {
      margin: 2px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .section-heading {
      margin: 8px 0 4px;
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    /* Home Task Cards — designed so all 4 fit above the fold at 360px */
    .tasks-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-card {
      width: 100%;
      min-height: 66px;
      padding: 10px 12px;
      border-radius: var(--radius-card);
      background: var(--surface);
      border: 1.5px solid var(--hairline);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: right;
      transition: background-color 120ms ease, border-color 120ms ease, transform 80ms ease;
    }

    .task-card:active {
      transform: scale(0.99);
    }

    /* Daily Tasks (1 & 2): Highest visual prominence */
    .task-card.task-daily {
      min-height: 76px;
      background: linear-gradient(135deg, #FFFDF8 0%, #FFF6E5 100%);
      border: 2px solid rgba(110, 28, 28, 0.35);
      box-shadow: 0 4px 14px -4px rgba(110, 28, 28, 0.16);
    }

    .task-card.task-daily .task-icon {
      width: 46px;
      height: 46px;
      background: linear-gradient(135deg, var(--primary), var(--primary-deep));
      color: var(--on-primary-accent);
    }

    .task-card.task-daily .task-title {
      font-size: 16px;
      color: var(--primary-deep);
    }

    /* Secondary Task (3): Add Page */
    .task-card.task-secondary {
      min-height: 64px;
      background: var(--surface);
      border-color: var(--hairline);
    }

    .task-card.task-secondary .task-icon {
      width: 42px;
      height: 42px;
      background: var(--surface-alt);
      color: var(--primary);
      border: 1px solid var(--hairline);
    }

    /* Rare / Complex Task (4): Season — visible above fold, visually calmer */
    .task-card.task-rare {
      min-height: 58px;
      padding: 8px 12px;
      background: rgba(244, 230, 204, 0.55);
      border: 1px dashed rgba(106, 74, 46, 0.45);
      box-shadow: none;
    }

    .task-card.task-rare .task-icon {
      width: 38px;
      height: 38px;
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--hairline);
    }

    .task-card.task-rare .task-title {
      font-size: 14px;
      color: var(--ink);
    }

    .task-card.task-rare.has-draft {
      background: #FFF3CD;
      border: 2px solid var(--gold-text);
    }

    .task-card.task-rare.has-draft .task-icon {
      background: var(--primary);
      color: var(--on-primary-accent);
      border-color: transparent;
    }

    .task-icon {
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .task-body {
      flex: 1;
      min-width: 0;
    }

    .task-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .task-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.3;
    }

    .task-sub {
      display: block;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
      margin-top: 2px;
    }

    .task-badge {
      display: inline-flex;
      align-items: center;
      padding: 1px 7px;
      border-radius: var(--radius-pill);
      font-size: 11px;
      font-weight: 700;
      background: var(--surface-alt);
      color: var(--muted);
      border: 1px solid var(--hairline);
    }

    .task-badge.daily-tag {
      background: rgba(110, 28, 28, 0.09);
      color: var(--primary);
      border-color: rgba(110, 28, 28, 0.22);
    }

    .task-badge.draft-tag {
      background: var(--primary);
      color: var(--on-primary);
      border-color: var(--primary);
    }

    .task-badge.active-season-tag {
      background: var(--success-bg);
      color: var(--success);
      border-color: var(--success-border);
    }

    .task-arrow {
      font-size: 20px;
      font-weight: 700;
      color: var(--muted);
      flex-shrink: 0;
      padding-inline-start: 4px;
    }

    /* Recent edits list & footer link on Home */
    .card {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-panel);
      padding: 14px;
      box-shadow: var(--shadow-sm);
    }

    .card-tight {
      padding: 12px;
      border-radius: var(--radius-card);
    }

    .recent-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .recent-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(226, 201, 154, 0.65);
    }

    .recent-item:last-child {
      padding-bottom: 0;
      border-bottom: none;
    }

    .recent-title {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--ink);
      display: block;
    }

    .recent-meta {
      font-size: 12px;
      color: var(--muted);
      display: block;
    }

    .advanced-link-btn {
      width: 100%;
      min-height: 48px;
      padding: 10px 14px;
      border-radius: var(--radius-card);
      border: 1px solid var(--hairline);
      background: rgba(255, 249, 238, 0.7);
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .advanced-link-btn:active {
      background: var(--surface-alt);
    }

    /* Buttons (minimum 44x44px, primary 48px) */
    .btn {
      min-height: 48px;
      min-width: 44px;
      padding: 10px 18px;
      border-radius: var(--radius-pill);
      font-size: 15px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      line-height: 1.25;
      transition: opacity 100ms ease, background-color 120ms ease;
    }

    .btn-sm {
      min-height: 44px;
      padding: 8px 14px;
      font-size: 13.5px;
    }

    .btn-block {
      width: 100%;
    }

    .btn-primary {
      background: linear-gradient(180deg, var(--primary) 0%, var(--primary-deep) 100%);
      color: var(--on-primary);
      box-shadow: 0 3px 10px rgba(79, 16, 16, 0.25);
    }

    .btn-primary:active {
      opacity: 0.92;
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--primary);
      border: 1.5px solid rgba(110, 28, 28, 0.45);
    }

    .btn-secondary:active {
      background: var(--surface-alt);
    }

    .btn-soft {
      background: var(--surface-alt);
      color: var(--ink);
      border: 1px solid var(--hairline);
    }

    .btn-soft:active {
      background: #EAD8B5;
    }

    .btn-danger {
      background: var(--alert-soft);
      color: var(--alert);
      border: 1.5px solid rgba(179, 38, 30, 0.4);
    }

    .btn-danger-solid {
      background: var(--alert);
      color: #FFFFFF;
    }

    .btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .icon-btn {
      min-width: 44px;
      min-height: 44px;
      padding: 0;
      border-radius: 12px;
      background: var(--surface-alt);
      border: 1px solid var(--hairline);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      flex-shrink: 0;
    }

    .icon-btn:active {
      background: #E8D5B0;
    }

    .icon-btn.danger {
      background: var(--alert-soft);
      border-color: rgba(179, 38, 30, 0.35);
      color: var(--alert);
    }

    .icon-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* Form Controls */
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field-label {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .req-tag {
      font-size: 11px;
      font-weight: 600;
      color: var(--script);
    }

    .field-hint {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.45;
      margin: 0;
    }

    .input, .textarea, .select {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border-radius: var(--radius-input);
      border: 1.5px solid var(--hairline);
      background: #FFFFFF;
      color: var(--ink);
      font-size: 15px;
      line-height: 1.5;
    }

    .textarea {
      min-height: 92px;
      resize: vertical;
    }

    .input.is-invalid,
    .textarea.is-invalid,
    .select.is-invalid {
      border-color: var(--alert);
      background: #FFF9F8;
    }

    .field-error {
      font-size: 13px;
      font-weight: 700;
      color: var(--alert);
      display: flex;
      align-items: flex-start;
      gap: 6px;
      line-height: 1.4;
      margin-top: 2px;
    }

    /* Choice Chips */
    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip-btn {
      min-height: 44px;
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      border: 1.5px solid var(--hairline);
      background: var(--surface);
      color: var(--ink);
      font-size: 13.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .chip-btn.selected {
      background: var(--primary);
      color: var(--on-primary);
      border-color: var(--primary-deep);
    }

    /* Written-state Switches (matching AdminStateSwitch) */
    .switch-row {
      width: 100%;
      min-height: 52px;
      padding: 10px 12px;
      border-radius: var(--radius-card);
      border: 1px solid var(--hairline);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-align: right;
    }

    .switch-row + .switch-row {
      margin-top: 8px;
    }

    .switch-text {
      flex: 1;
      min-width: 0;
    }

    .switch-title {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.35;
    }

    .switch-sub {
      display: block;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
      margin-top: 2px;
    }

    .switch-state-wrap {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .state-badge {
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      font-size: 11.5px;
      font-weight: 700;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .state-badge.on {
      background: var(--success-bg);
      color: var(--success);
      border-color: var(--success-border);
    }

    .state-badge.off {
      background: var(--surface-alt);
      color: var(--muted);
      border-color: var(--hairline);
    }

    .toggle-pill {
      width: 46px;
      height: 28px;
      border-radius: 999px;
      background: var(--surface-alt);
      border: 1.5px solid var(--muted);
      position: relative;
      transition: background-color 140ms ease;
      flex-shrink: 0;
    }

    .toggle-pill::after {
      content: '';
      position: absolute;
      top: 3px;
      right: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--muted);
      transition: transform 140ms ease, background-color 140ms ease;
    }

    .switch-row[aria-checked="true"] .toggle-pill {
      background: var(--primary);
      border-color: var(--primary);
    }

    .switch-row[aria-checked="true"] .toggle-pill::after {
      background: var(--on-primary-accent);
      transform: translateX(-18px);
    }

    /* Banners & Alerts */
    .banner {
      border-radius: var(--radius-card);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13.5px;
      line-height: 1.5;
    }

    .banner-success {
      background: var(--success-bg);
      border: 1.5px solid var(--success-border);
      color: #1B472B;
    }

    .banner-error {
      background: var(--alert-soft);
      border: 2px solid var(--alert);
      color: #5E1410;
    }

    .banner-notice {
      background: var(--notice-bg);
      border: 1.5px solid var(--notice-edge);
      color: var(--ink);
    }

    .banner-title {
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
    }

    /* Error Summary List (Screen 8) */
    .error-summary-list {
      list-style: none;
      margin: 4px 0 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .error-summary-btn {
      width: 100%;
      min-height: 44px;
      padding: 8px 10px;
      border-radius: 10px;
      background: #FFFFFF;
      border: 1.5px solid rgba(179, 38, 30, 0.45);
      color: #6B1612;
      font-size: 13px;
      font-weight: 700;
      text-align: right;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .error-summary-btn:active {
      background: var(--alert-bg);
    }

    /* RTL Progress Bar (Screen 4) — strictly fills from RIGHT to LEFT */
    .wizard-progress-wrap {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-card);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .wizard-progress-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
    }

    .progress-track {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: var(--surface-alt);
      border: 1px solid var(--hairline);
      overflow: hidden;
      display: flex;
      justify-content: flex-start; /* in dir="rtl", flex-start is the RIGHT edge */
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(270deg, var(--primary) 0%, var(--primary-light) 100%);
      transition: width 220ms ease;
    }

    /* Preview Box (Announcements & Season) */
    .visitor-preview {
      background: #FFFFFF;
      border: 2px solid var(--gold-ornament);
      border-radius: var(--radius-panel);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .visitor-preview-head {
      background: var(--surface-alt);
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      border-bottom: 1px solid var(--hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .visitor-preview-body {
      padding: 12px;
    }

    .visitor-alert-box {
      background: var(--alert-bg);
      border: 1.5px solid var(--primary);
      border-radius: 14px;
      padding: 10px 12px;
    }

    .visitor-alert-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary-deep);
      margin: 0 0 4px;
    }

    .visitor-alert-text {
      font-size: 13.5px;
      color: var(--ink);
      margin: 0;
    }

    /* Mass Cards */
    .mass-card {
      background: var(--surface);
      border: 1.5px solid var(--hairline);
      border-radius: var(--radius-card);
      padding: 12px;
      display: flex;

      function loadData() {
        try {
          const raw = localStorage.getItem(STORAGE_DATA_KEY);
          if (raw) return JSON.parse(raw);
        } catch (_) {}
        return createDefaultData();
      }

      function saveData() {
        try {
          localStorage.setItem(STORAGE_DATA_KEY, JSON.stringify(state.data));
        } catch (_) {}
      }

      function loadSeasonDraft() {
        try {
          const raw = localStorage.getItem(STORAGE_SEASON_DRAFT_KEY);
          if (raw) return JSON.parse(raw);
        } catch (_) {}
        return null;
      }

      function saveSeasonDraft(draft) {
        try {
          if (draft) {
            localStorage.setItem(STORAGE_SEASON_DRAFT_KEY, JSON.stringify(draft));
          } else {
            localStorage.removeItem(STORAGE_SEASON_DRAFT_KEY);
          }
        } catch (_) {}
      }

        seasonDraft: loadSeasonDraft(),

        seasonError: '',

        snackbar: {

      function getSeasonCatalogItem(key) {
        return SEASONS_CATALOG.find(function (s) { return s.key === key; }) || SEASONS_CATALOG[0];
      }

      function createFreshSeasonDraft(seasonKey) {
        const cat = getSeasonCatalogItem(seasonKey || 'holy_week');
        return {
          step: 1, // 1..3
          seasonKey: cat.key,
          startDate: cat.defaultStart,
          endDate: cat.defaultEnd,
          usedLastYear: false,
          options: deepClone(cat.defaults)
        };
      }

      function persistSeasonDraft() {
        saveSeasonDraft(state.seasonDraft);
      }

      function addRecentEdit(title) {
        state.data.recentEdits.unshift({
          title: title,
          meta: 'دلوقتي حالًا · تجربة على النموذج'
        });
        if (state.data.recentEdits.length > 6) {
          state.data.recentEdits.length = 6;
        }
        saveData();

      // =========================================================================
      // Screen 7: Delete Confirmation + 10-second Undo Snackbar
      // =========================================================================
      const modalEl = document.getElementById('confirm-modal');
      const modalTitleEl = document.getElementById('modal-title');
      const modalBodyEl = document.getElementById('modal-body');
      const modalCancelEl = document.getElementById('modal-cancel');
      const modalConfirmEl = document.getElementById('modal-confirm');

      const snackWrapEl = document.getElementById('snackbar-wrap');
      const snackMsgEl = document.getElementById('snackbar-msg');
      const snackUndoEl = document.getElementById('snackbar-undo');

      let lastFocusedBeforeModal = null;

      function openConfirmModal(opts) {
        lastFocusedBeforeModal = document.activeElement;
        state.modal = opts;
        modalTitleEl.textContent = opts.title;
        modalBodyEl.textContent = opts.body;
        modalConfirmEl.textContent = opts.confirmLabel || 'أيوه، امسح';
        modalCancelEl.textContent = opts.cancelLabel || 'لأ، خليها';
        modalEl.hidden = false;
        modalCancelEl.focus();
      }

      function closeConfirmModal() {
        modalEl.hidden = true;
        state.modal = null;
        if (lastFocusedBeforeModal && typeof lastFocusedBeforeModal.focus === 'function') {
          lastFocusedBeforeModal.focus();
        }
      }

      modalCancelEl.addEventListener('click', closeConfirmModal);
      modalConfirmEl.addEventListener('click', function () {
        const fn = state.modal && state.modal.onConfirm;
        closeConfirmModal();
        if (typeof fn === 'function') fn();
      });

      modalEl.addEventListener('click', function (e) {
        if (e.target === modalEl) closeConfirmModal();
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !modalEl.hidden) {
          closeConfirmModal();
        }
      });

      function hideSnackbar() {
        if (state.snackbar.timer) {
          clearInterval(state.snackbar.timer);
          state.snackbar.timer = null;
        }
        state.snackbar.visible = false;
        state.snackbar.undoFn = null;
        snackWrapEl.hidden = true;
      }

      function showUndoSnackbar(baseMsg, undoFn) {
        hideSnackbar();
        state.snackbar.visible = true;
        state.snackbar.msg = baseMsg;
        state.snackbar.secondsLeft = 10;
        state.snackbar.undoFn = undoFn;
        updateSnackbarText();
        snackWrapEl.hidden = false;

        state.snackbar.timer = setInterval(function () {
          state.snackbar.secondsLeft -= 1;
          if (state.snackbar.secondsLeft <= 0) {
            hideSnackbar();
          } else {
            updateSnackbarText();
          }
        }, 1000);
      }

      function updateSnackbarText() {
        snackMsgEl.textContent = state.snackbar.msg + ' (' + toArabicDigits(state.snackbar.secondsLeft) + ' ث)';
      }

      snackUndoEl.addEventListener('click', function () {
        const fn = state.snackbar.undoFn;
        hideSnackbar();
        if (typeof fn === 'function') fn();
      });

      // =========================================================================
      // Navigation
      // =========================================================================
      function go(screenName) {
        state.screen = screenName;
        if (screenName === 'announcement') {
          state.ann.mode = 'edit';
          state.ann.errorTitle = '';
        }
        if (screenName === 'masses') {
          state.massesUi.bannerText = '';
          state.massesUi.justUpdatedId = null;
        }
        if (screenName === 'season') {
          state.seasonConfirmed = null;
          state.seasonError = '';
          if (!state.seasonDraft) {
            state.seasonDraft = createFreshSeasonDraft('holy_week');
            persistSeasonDraft();
          }
        }
        if (screenName === 'page') {
          loadWorkingPage(state.pageUi.selectedPageId || 'page-new');
        }
        render();
        window.scrollTo({ top: 0, behavior: 'auto' });
      }

      function loadWorkingPage(pageId) {
        const found = state.data.pages.find(function (p) { return p.id === pageId; }) || state.data.pages[0];
        state.pageUi.selectedPageId = found.id;
        state.pageUi.workingPage = deepClone(found);
        state.pageUi.showErrors = false;
        state.pageUi.errors = [];
        state.pageUi.savedBanner = '';
        state.pageUi.focusTargetId = null;
      }

      function to12Parts(h24, m) {
        const period = h24 >= 12 ? 'PM' : 'AM';
        let h12 = h24 % 12;
        if (h12 === 0) h12 = 12;
        return { h12: h12, m: m, period: period };
      }

      function to24Hour(h12, period) {
        const h = Number(h12);
        if (period === 'AM') return h === 12 ? 0 : h;
        return h === 12 ? 12 : h + 12;
      }

      function renderTimeControls(prefix, h24, m) {
        const p = to12Parts(h24, m);
        let hOpts = '';
        for (let i = 1; i <= 12; i++) {
          hOpts += '<option value="' + i + '"' + (p.h12 === i ? ' selected' : '') + '>' + toArabicDigits(i) + '</option>';
        }
        const mins = [0, 15, 30, 45];
        let mOpts = '';
        for (let i = 0; i < mins.length; i++) {
          const mv = mins[i];
          const label = mv < 10 ? '0' + mv : String(mv);
          mOpts += '<option value="' + mv + '"' + (p.m === mv ? ' selected' : '') + '>' + toArabicDigits(label) + '</option>';
        }
        return '<div class="time-picker-row">' +
          '<select class="select" id="' + prefix + '-h" aria-label="الساعة">' + hOpts + '</select>' +
          '<select class="select" id="' + prefix + '-m" aria-label="الدقائق">' + mOpts + '</select>' +
          '<select class="select" id="' + prefix + '-p" aria-label="صباحًا أم مساءً">' +
            '<option value="AM"' + (p.period === 'AM' ? ' selected' : '') + '>صباحًا (ص)</option>' +
            '<option value="PM"' + (p.period === 'PM' ? ' selected' : '') + '>مساءً (م)</option>' +
          '</select>' +
        '</div>';
      }

          const hEl = document.getElementById(prefix + '-h');

      function buildSeasonSummaryItems(draft) {
        const o = draft.options;
        const list = [];
        if (o.replaceRegular) {
          list.push({ kind: 'hide', text: 'الجدول الأسبوعي العادي هيتخفي، وصلوات الموسم بس هي اللي هتظهر.' });
        } else {
          list.push({ kind: 'on', text: 'الجدول الأسبوعي العادي هيفضل ظاهر، وصلوات الموسم هتتضاف معاه.' });
        }
        if (o.hideMeetings) list.push({ kind: 'hide', text: 'قسم الاجتماعات ومدارس الأحد هيتخفي لحد نهاية الموسم.' });
        if (o.hideClinics) list.push({ kind: 'hide', text: 'قسم العيادات هيتخفي لحد نهاية الموسم.' });
        if (o.weddingOff) list.push({ kind: 'hide', text: 'اختيار «حجز الأفراح» هيتخفي من نموذج التواصل.' });
        if (o.calmHero) list.push({ kind: 'info', text: 'واجهة الموقع هتبقى صورة ثابتة هادية من غير فيديو متحرك.' });
        if (o.seasonTheme) list.push({ kind: 'on', text: 'ألوان وثيم الموسم هتتفعّل تلقائيًا على الموقع.' });
        if (o.liveUrl && o.liveUrl.trim()) list.push({ kind: 'on', text: 'هيتجهّز رابط البث المباشر: ' + o.liveUrl.trim() });
        if (o.pdfUrl && o.pdfUrl.trim()) list.push({ kind: 'on', text: 'هيظهر زر تحميل كتيّب / برنامج الموسم للزوار.' });
        list.push({ kind: 'info', text: 'في ' + formatDateAr(draft.endDate) + ' كل حاجة هترجع للوضع العادي لوحدها.' });
        return list;
      }

      // =========================================================================
      // Screen 5 & 8: Page Editor + Universal Error Handling for ALL Block Types
      // =========================================================================
      function blockTypeLabel(type) {
        if (type === 'text') return 'نص';
        if (type === 'list') return 'قايمة';
        if (type === 'details') return 'تفاصيل';
        return 'فقرة';
      }

      function blockSnippet(block) {
        if (block.type === 'text') {
          return (block.heading || block.body || '(نص فاضي)').trim();
        }
        if (block.type === 'list') {
          const nonEmpty = (block.items || []).filter(function (x) { return x.trim(); });
          if (block.title && block.title.trim()) return block.title.trim() + ' (' + toArabicDigits(nonEmpty.length) + ')';
          if (nonEmpty.length > 0) return nonEmpty[0].trim() + (nonEmpty.length > 1 ? ' (+' + toArabicDigits(nonEmpty.length - 1) + ')' : '');
          return '(قايمة فاضية)';
        }
        if (block.type === 'details') {
          return (block.summary || block.body || '(تفاصيل فاضية)').trim();
        }
        return '(فقرة)';
      }

      function validateWorkingPage(page) {
        const errors = [];
        if (!page.title || !page.title.trim()) {
          errors.push({
            id: 'err-page-title',
            blockId: null,
            fieldKey: 'title',
            inputId: 'page-title-input',
            message: 'عنوان الصفحة فاضي — اكتب الاسم اللي هيظهر فوق في الصفحة.'
          });
        }

        page.blocks.forEach(function (b, idx) {
          const num = toArabicDigits(idx + 1);
          const snippet = blockSnippet(b);
          const nameHint = snippet && snippet.indexOf('(') !== 0 ? '«' + snippet.slice(0, 22) + (snippet.length > 22 ? '…' : '') + '» ' : '';

          if (b.type === 'text') {
            if (!b.body || !b.body.trim()) {
              errors.push({
                id: 'err-' + b.id + '-body',
                blockId: b.id,
                fieldKey: 'body',
                inputId: 'inp-' + b.id + '-body',
                message: 'فقرة النص ' + nameHint + '(رقم ' + num + '): الكلام اللي جواها فاضي — اكتب النص أو امسح الفقرة.'
              });
            }
          } else if (b.type === 'list') {
            if (!b.items || b.items.length === 0) {
              errors.push({
                id: 'err-' + b.id + '-empty',
                blockId: b.id,
                fieldKey: 'list-empty',
                inputId: 'add-item-' + b.id,
                message: 'القايمة ' + nameHint + '(رقم ' + num + '): مفيهاش ولا عنصر — ضيف سطر واحد على الأقل.'
              });
            } else {
              b.items.forEach(function (it, itemIdx) {
                if (!it || !it.trim()) {
                  errors.push({
                    id: 'err-' + b.id + '-item-' + itemIdx,
                    blockId: b.id,
                    fieldKey: 'item-' + itemIdx,
                    inputId: 'inp-' + b.id + '-item-' + itemIdx,
                    message: 'القايمة ' + nameHint + '(رقم ' + num + '): السطر رقم ' + toArabicDigits(itemIdx + 1) + ' فاضي — اكتبه أو امسحه.'
                  });
                }
              });
            }
          } else if (b.type === 'details') {
            if (!b.summary || !b.summary.trim()) {
              errors.push({
                id: 'err-' + b.id + '-summary',
                blockId: b.id,
                fieldKey: 'summary',
                inputId: 'inp-' + b.id + '-summary',
                message: 'فقرة التفاصيل ' + nameHint + '(رقم ' + num + '): العنوان اللي يظهر بره فاضي.'
              });
            }
            if (!b.body || !b.body.trim()) {
              errors.push({
                id: 'err-' + b.id + '-body',
                blockId: b.id,
                fieldKey: 'body',
                inputId: 'inp-' + b.id + '-body',
                message: 'فقرة التفاصيل ' + nameHint + '(رقم ' + num + '): الكلام اللي بيتفتح جوه فاضي.'
              });
            }
          }
        });

        return errors;
      }

      function focusAndScrollToInput(inputId, blockId) {
        if (blockId) {
          const blk = state.pageUi.workingPage.blocks.find(function (b) { return b.id === blockId; });
          if (blk && !blk.expanded) {
            blk.expanded = true;
            render();
          }
        }
        requestAnimationFrame(function () {
          const target = document.getElementById(inputId);
          if (target) {
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            setTimeout(function () { target.focus(); }, 180);
          }
        });
      }

      function renderPageEditor(main, sticky) {
        main.classList.remove('home-content');
        const page = state.pageUi.workingPage;
        const errors = state.pageUi.showErrors ? validateWorkingPage(page) : [];
        state.pageUi.errors = errors;

        const errorByBlock = {};
        const errorByField = {};
        errors.forEach(function (er) {
          errorByField[er.inputId] = er.message;
          if (er.blockId) errorByBlock[er.blockId] = true;
        });

        // Switcher between new page and sample existing pages
        const switcherHtml =
          '<div class="chip-row" aria-label="اختار صفحة">' +
            state.data.pages.map(function (p) {
              const label = p.isNewTemplate ? 'صفحة جديدة' : p.title.replace('مثال: ', '');
              return '<button type="button" class="chip-btn page-switch-pill' + (p.id === state.pageUi.selectedPageId ? ' selected' : '') + '" data-pid="' + esc(p.id) + '">' + esc(label) + '</button>';
            }).join('') +
          '</div>';

        // Error Summary Banner (Screen 8)
        let errorSummaryHtml = '';
        if (errors.length > 0) {
          errorSummaryHtml =
            '<div class="banner banner-error" id="page-error-summary" role="alert" tabindex="-1">' +
              '<p class="banner-title">' + ICONS.alert + ' <span>في ' + toArabicDigits(errors.length) + ' حاجات محتاجة تصليح قبل الحفظ</span></p>' +
              '<span style="font-size:12.5px;">فتحنا لك الفقرات اللي فيها مشكلة تحت — اضغط على أي سطر عشان تروحله على طول:</span>' +
              '<ul class="error-summary-list">' +
                errors.map(function (er) {
                  return '<li><button type="button" class="error-summary-btn" data-input="' + esc(er.inputId) + '" data-block="' + esc(er.blockId || '') + '">' +
                    '<span>' + esc(er.message) + '</span>' +
                    '<span dir="ltr" aria-hidden="true">‹</span>' +
                  '</button></li>';
                }).join('') +
              '</ul>' +
            '</div>';
        }

        const savedBannerHtml = state.pageUi.savedBanner
          ? '<div class="banner banner-success" role="status">' +
              '<p class="banner-title">' + ICONS.check + ' <span>اتحفظت الصفحة!</span></p>' +
              '<span>' + esc(toArabicDigits(state.pageUi.savedBanner)) + '</span>' +
            '</div>'
          : '';

        const blocksHtml = page.blocks.map(function (b, idx) {
          const hasErr = !!errorByBlock[b.id];
          const num = toArabicDigits(idx + 1);
          const isFirst = idx === 0;
          const isLast = idx === page.blocks.length - 1;

          let bodyHtml = '';
          if (b.expanded) {
            if (b.type === 'text') {
              const errMsg = errorByField['inp-' + b.id + '-body'];

      function runPageSave() {
        const page = state.pageUi.workingPage;
        const errors = validateWorkingPage(page);
        if (errors.length > 0) {
          state.pageUi.showErrors = true;
          state.pageUi.savedBanner = '';
          // Auto-expand EVERY block that has an error (text, list, AND details)
          const badBlockIds = {};
          errors.forEach(function (er) {
            if (er.blockId) badBlockIds[er.blockId] = true;
          });
          page.blocks.forEach(function (b) {
            if (badBlockIds[b.id]) b.expanded = true;
          });
          render();
          // Scroll to and focus the first offending block/field
          const first = errors[0];
          focusAndScrollToInput(first.inputId, first.blockId);
          return;
        }

        // Valid save
        state.pageUi.showErrors = false;
        state.pageUi.errors = [];
        const cleanTitle = page.title.trim();

        if (page.isNewTemplate) {
          const created = deepClone(page);
          created.id = uid('page');
          created.isNewTemplate = false;
          created.title = cleanTitle;
          state.data.pages.push(created);
          state.pageUi.selectedPageId = created.id;
          state.pageUi.workingPage = deepClone(created);
          // Reset fresh template
          state.data.pages[0] = {
            id: 'page-new',
            isNewTemplate: true,
            title: '',
            subtitle: '',
            visible: true,
            blocks: [{ id: uid('b'), type: 'text', heading: '', body: '', expanded: true }]
          };
        } else {
          const idx = state.data.pages.findIndex(function (p) { return p.id === page.id; });
          if (idx >= 0) {
            state.data.pages[idx] = deepClone(page);
          }
        }
        saveData();
        addRecentEdit('حفظ صفحة «' + cleanTitle + '» (' + toArabicDigits(page.blocks.length) + ' فقرات)');
        state.pageUi.savedBanner = 'صفحة «' + cleanTitle + '» اتحفظت بكل فقراتها (' + toArabicDigits(page.blocks.length) + ') وبقت جاهزة للزوار.';
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

          '<div class="card card-tight">' +
            '<strong style="font-size:14.5px;display:block;margin-bottom:4px;">إعادة ضبط النموذج التجريبي</strong>' +
            '<p class="field-hint" style="margin-bottom:10px;">لو حابب ترجّع كل بيانات المثال والمسودات زي أول ما فتحت.</p>' +
            '<button type="button" class="btn btn-danger btn-sm btn-block" id="adv-reset-demo">رجّع بيانات المثال من الأول</button>' +
          '</div>';

        main.querySelectorAll('.adv-switch').forEach(function (sw) {
          sw.addEventListener('click', function () {
            const k = sw.getAttribute('data-key');
            adv.sections[k] = !adv.sections[k];
            saveData();
            render();
          });
        });
        document.getElementById('adv-install').addEventListener('click', function () {
          adv.installBanner = !adv.installBanner;
          saveData();
          render();
        });
        document.getElementById('adv-sentry').addEventListener('click', function () {
          adv.errorReporting = !adv.errorReporting;
          saveData();
          render();
        });
        document.getElementById('adv-reset-demo').addEventListener('click', function () {
          openConfirmModal({
            title: 'متأكد ترجّع كل بيانات المثال من الأول؟',
            body: 'أي تعديلات عملتها في النموذج التجريبي ده هترجع للحالة الأولية.',
            confirmLabel: 'أيوه، رجّع المثال',
            cancelLabel: 'لأ، خلي التعديلات',
            onConfirm: function () {
              state.data = createDefaultData();
              state.seasonDraft = null;
              state.seasonConfirmed = null;
              saveData();
              saveSeasonDraft(null);
              go('home');
            }
          });
        });
      }

      // =========================================================================
      // Main Render Dispatch
      // =========================================================================
      function render() {
        renderTopbar();
        const main = document.getElementById('main-content');
        const sticky = document.getElementById('sticky-slot');
        if (state.screen === 'home') renderHome(main, sticky);
        else if (state.screen === 'announcement') renderAnnouncement(main, sticky);
        else if (state.screen === 'masses') renderMasses(main, sticky);
        else if (state.screen === 'mass-edit') renderMassEdit(main, sticky);
        else if (state.screen === 'season') renderSeason(main, sticky);
        else if (state.screen === 'page') renderPageEditor(main, sticky);
        else if (state.screen === 'advanced') renderAdvanced(main, sticky);
        else renderHome(main, sticky);
      }

      render();
    })();
  </script>
</body>
</html>
